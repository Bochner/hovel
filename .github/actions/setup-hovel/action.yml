name: Set up Hovel build
description: Install Aspect CLI and configure BuildBuddy remote execution and invocation evidence.

inputs:
  cache-family:
    description: Dependency population owned by this scope or release family.
    required: false
    default: shared
  buildbuddy-api-key:
    description: BuildBuddy credential; empty for fork PRs and local-only builds.
    required: false
    default: ""
  configure-cache:
    description: Run the repository cache selector after installing Aspect.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/bazelisk
          ~/.cache/bazel-repository
        key: bazel-repository-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-family }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', '.bazelversion', 'core/MODULE.bazel', 'core/MODULE.bazel.lock', 'core/.bazelversion', '.aspect/version.axl', '**/*.bzl') }}
        restore-keys: bazel-repository-v3-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-family }}-

    - name: Set up Aspect CLI
      uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
      with:
        launcher-version: "2026.33.3"
        # BuildBuddy owns action caching; the step above owns repository caching.
        disk-cache: "false"
        repository-cache: "false"

    - name: Configure BuildBuddy and invocation capture
      if: inputs.configure-cache == 'true'
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: aspect hovel-ci setup
