name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: repo
            name: Repository policy and build hygiene
          - scope: core
            name: Core fmt, lint, build, test
            release: hovel
            artifact: hovel-dist
            path: core/dist/
          - scope: sdk
            name: SDK build and test
          - scope: module-examples
            name: Module examples build and test
          - scope: modules
            name: Modules build and test
            release: modules
            artifact: module-packages
            path: dist/modules/
          - scope: agent
            name: Agent integration packages
            release: agent
            artifact: agent-integration-packages
            path: dist/agent/
    env:
      HOVEL_CI_SCOPE: ${{ matrix.scope }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: check-${{ matrix.scope }}
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Verify slice
        env:
          CHECK_SCOPE: ${{ matrix.scope }}
        run: aspect hovel-check "$CHECK_SCOPE"
      - name: Build release artifacts
        if: matrix.release != ''
        env:
          RELEASE_KIND: ${{ matrix.release }}
        run: aspect hovel-release "$RELEASE_KIND"
      - name: Upload release artifacts
        if: matrix.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload failed test evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testlogs-${{ matrix.scope }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            core/bazel-testlogs/**/test.log
            core/bazel-testlogs/**/test.xml
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  docs:
    name: Docs, test report, and Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: docs
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Build evidence-backed Pages site
        run: aspect hovel-report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}

  squatter-wine:
    name: Squatter Wine tests and demo
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-hovel
        with:
          cache-family: wine
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}
      - name: Install demo host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --install-recommends wine32 wine64
      - name: Verify Wine integration and materialize demo
        run: aspect hovel-ci wine
      - uses: ./.github/actions/finish-hovel
        if: always()
        with:
          job-status: ${{ job.status }}
