name: Pages

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      pages: read
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-hovel
        if: github.event_name == 'workflow_dispatch'
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_API_KEY }}

      - name: Download successful CI site
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: _site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build evidence-backed Pages site
        if: github.event_name == 'workflow_dispatch'
        run: aspect hovel-report

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - uses: ./.github/actions/finish-hovel
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          job-status: ${{ job.status }}

  deploy:
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Pages Deploy"
            echo ""
            echo "Deploys the uploaded _site/ artifact to the github-pages environment."
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Status | ${{ job.status }} |"
            echo "| Environment | github-pages |"
            echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
            echo ""
            echo "### What This Proves"
            echo ""
            echo "- GitHub Pages accepted the artifact produced by the Pages build job."
            echo "- The public documentation URL was updated for this run."
          } >> "$GITHUB_STEP_SUMMARY"
